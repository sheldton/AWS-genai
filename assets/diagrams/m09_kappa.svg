<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">Cohen's kappa — agreement beyond chance (illustrative numbers, 38 items)</text>

  <!-- confusion matrix: good judge -->
  <text x="20" y="62" font-size="13" font-weight="bold" fill="#0073bb">A calibrated judge</text>
  <text x="190" y="84" font-size="11" text-anchor="middle" fill="#555">judge PASS</text>
  <text x="270" y="84" font-size="11" text-anchor="middle" fill="#555">judge FAIL</text>
  <text x="80" y="117" font-size="11" text-anchor="end" fill="#555">human PASS</text>
  <text x="80" y="167" font-size="11" text-anchor="end" fill="#555">human FAIL</text>
  <rect x="150" y="92" width="80" height="44" fill="#e8f5e3" stroke="#1d8102"/><text x="190" y="120" font-size="16" text-anchor="middle" font-weight="bold">20</text>
  <rect x="230" y="92" width="80" height="44" fill="#fdecea" stroke="#d13212"/><text x="270" y="120" font-size="16" text-anchor="middle">2</text>
  <rect x="150" y="142" width="80" height="44" fill="#fdecea" stroke="#d13212"/><text x="190" y="170" font-size="16" text-anchor="middle">1</text>
  <rect x="230" y="142" width="80" height="44" fill="#e8f5e3" stroke="#1d8102"/><text x="270" y="170" font-size="16" text-anchor="middle" font-weight="bold">15</text>
  <text x="90" y="210" font-size="11" fill="#555">green = agree · red = disagree</text>

  <text x="20" y="242" font-size="12">p_o = (20 + 15) / 38 = 0.92</text>
  <text x="20" y="262" font-size="12">p_e = P(both PASS) + P(both FAIL)</text>
  <text x="20" y="280" font-size="12">     = 22/38 · 21/38 + 16/38 · 17/38 = 0.51</text>
  <text x="20" y="306" font-size="13" font-weight="bold" fill="#0073bb">κ = (0.92 − 0.51) / (1 − 0.51) ≈ 0.84</text>

  <!-- formula -->
  <rect x="360" y="60" width="250" height="140" rx="10" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="485" y="92" font-size="18" text-anchor="middle" font-weight="bold" fill="#232f3e">κ = (p_o − p_e) / (1 − p_e)</text>
  <text x="375" y="122" font-size="11">p_o — share of items where judge</text>
  <text x="375" y="137" font-size="11">and human give the same label</text>
  <text x="375" y="162" font-size="11">p_e — agreement expected by chance</text>
  <text x="375" y="177" font-size="11">from each rater's own PASS rate</text>

  <!-- always pass -->
  <text x="650" y="62" font-size="13" font-weight="bold" fill="#d13212">A judge that always says PASS</text>
  <text x="790" y="84" font-size="11" text-anchor="middle" fill="#555">judge PASS</text>
  <text x="870" y="84" font-size="11" text-anchor="middle" fill="#555">judge FAIL</text>
  <text x="740" y="117" font-size="11" text-anchor="end" fill="#555">human PASS</text>
  <text x="740" y="167" font-size="11" text-anchor="end" fill="#555">human FAIL</text>
  <rect x="750" y="92" width="80" height="44" fill="#e8f5e3" stroke="#1d8102"/><text x="790" y="120" font-size="16" text-anchor="middle" font-weight="bold">22</text>
  <rect x="830" y="92" width="80" height="44" fill="#fdecea" stroke="#d13212"/><text x="870" y="120" font-size="16" text-anchor="middle">0</text>
  <rect x="750" y="142" width="80" height="44" fill="#fdecea" stroke="#d13212"/><text x="790" y="170" font-size="16" text-anchor="middle">16</text>
  <rect x="830" y="142" width="80" height="44" fill="#e8f5e3" stroke="#1d8102"/><text x="870" y="170" font-size="16" text-anchor="middle">0</text>
  <text x="650" y="242" font-size="12">p_o = 22 / 38 = 0.58 — looks respectable</text>
  <text x="650" y="262" font-size="12">p_e = 22/38 · 38/38 + 16/38 · 0 = 0.58</text>
  <text x="650" y="306" font-size="13" font-weight="bold" fill="#d13212">κ = 0 — it adds nothing</text>

  <!-- scale -->
  <line x1="60" y1="350" x2="900" y2="350" stroke="#232f3e" stroke-width="2"/>
  <rect x="60" y="342" width="168" height="16" fill="#fdecea"/>
  <rect x="228" y="342" width="336" height="16" fill="#fff7ec"/>
  <rect x="564" y="342" width="168" height="16" fill="#f1f8fd"/>
  <rect x="732" y="342" width="168" height="16" fill="#e8f5e3"/>
  <text x="60" y="378" font-size="11" text-anchor="middle">−0.2</text>
  <text x="228" y="378" font-size="11" text-anchor="middle">0 (chance)</text>
  <text x="564" y="378" font-size="11" text-anchor="middle">0.6</text>
  <text x="732" y="378" font-size="11" text-anchor="middle">0.8</text>
  <text x="900" y="378" font-size="11" text-anchor="middle">1</text>
  <text x="144" y="337" font-size="11" text-anchor="middle" fill="#d13212">worse than chance</text>
  <text x="396" y="337" font-size="11" text-anchor="middle" fill="#c66c00">slight … moderate</text>
  <text x="648" y="337" font-size="11" text-anchor="middle" fill="#0073bb">substantial</text>
  <text x="816" y="337" font-size="11" text-anchor="middle" fill="#1d8102">near-perfect</text>
</svg>
