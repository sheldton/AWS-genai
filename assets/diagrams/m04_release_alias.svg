<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8102"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker>
  </defs>
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#232f3e">Release, gate, roll back — everything immutable except one pointer</text>
  <!-- column headers -->
  <text x="110" y="62" font-size="13" font-weight="bold" fill="#c66c00" text-anchor="middle">Prompt versions</text>
  <text x="400" y="62" font-size="13" font-weight="bold" fill="#232f3e" text-anchor="middle">Flow versions (snapshots)</text>
  <text x="660" y="62" font-size="13" font-weight="bold" fill="#0073bb" text-anchor="middle">Alias</text>
  <text x="860" y="62" font-size="13" font-weight="bold" fill="#232f3e" text-anchor="middle">Application</text>
  <!-- prompt versions -->
  <rect x="30" y="85" width="160" height="50" rx="8" fill="#fff7ec" stroke="#ff9900"/><text x="110" y="106" font-size="12" text-anchor="middle" font-weight="bold">triage : 1</text><text x="110" y="123" font-size="11" text-anchor="middle" fill="#555">definitions + JSON contract</text>
  <rect x="30" y="185" width="160" height="50" rx="8" fill="#fff7ec" stroke="#ff9900"/><text x="110" y="206" font-size="12" text-anchor="middle" font-weight="bold">triage : 2</text><text x="110" y="223" font-size="11" text-anchor="middle" fill="#555">trimmed (≈ half the tokens)</text>
  <!-- flow versions -->
  <rect x="310" y="85" width="180" height="50" rx="8" fill="#f1f8fd" stroke="#232f3e"/><text x="400" y="106" font-size="12" text-anchor="middle" font-weight="bold">flow version 1</text><text x="400" y="123" font-size="11" text-anchor="middle" fill="#555">release 1 · pins triage:1</text>
  <rect x="310" y="185" width="180" height="50" rx="8" fill="#f1f8fd" stroke="#232f3e"/><text x="400" y="206" font-size="12" text-anchor="middle" font-weight="bold">flow version 2</text><text x="400" y="223" font-size="11" text-anchor="middle" fill="#555">release 2 · pins triage:2</text>
  <line x1="190" y1="110" x2="310" y2="110" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="190" y1="210" x2="310" y2="210" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- alias -->
  <rect x="600" y="135" width="120" height="50" rx="25" fill="#0073bb"/><text x="660" y="157" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">live</text><text x="660" y="173" font-size="10" text-anchor="middle" fill="#fff">routingConfiguration</text>
  <!-- pointer moves -->
  <path d="M600,150 C560,150 540,110 490,110" fill="none" stroke="#1d8102" stroke-width="2" marker-end="url(#g)"/>
  <text x="545" y="88" font-size="11" text-anchor="middle" fill="#1d8102">① baseline · ④ rollback</text>
  <path d="M600,170 C560,170 540,210 490,210" fill="none" stroke="#d13212" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#r)"/>
  <text x="545" y="240" font-size="11" text-anchor="middle" fill="#d13212">② release moved live</text>
  <!-- app -->
  <rect x="790" y="135" width="140" height="50" rx="8" fill="#fff" stroke="#232f3e"/><text x="860" y="156" font-size="12" text-anchor="middle">InvokeFlow</text><text x="860" y="173" font-size="11" text-anchor="middle" fill="#555">flowAliasIdentifier</text>
  <line x1="790" y1="160" x2="720" y2="160" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- gate -->
  <rect x="310" y="265" width="410" height="50" rx="8" fill="#fdecea" stroke="#d13212"/>
  <text x="515" y="286" font-size="12" text-anchor="middle" font-weight="bold" fill="#d13212">③ regression gate: the golden set through live</text>
  <text x="515" y="303" font-size="11" text-anchor="middle">fail if any message the baseline routed right now breaks, or rule violations grow</text>
  <text x="30" y="285" font-size="11" fill="#555">Versions are never edited —</text>
  <text x="30" y="300" font-size="11" fill="#555">the bad one stays for the</text>
  <text x="30" y="315" font-size="11" fill="#555">post-mortem.</text>
  <text x="790" y="215" font-size="11" fill="#555">the app never names</text>
  <text x="790" y="230" font-size="11" fill="#555">a version: rollback is</text>
  <text x="790" y="245" font-size="11" fill="#555">update_flow_alias, &lt; 1 s</text>
</svg>
