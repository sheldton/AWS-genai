<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="320" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker></defs>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#232f3e">Circuit breaker — one per model</text>
  <ellipse cx="150" cy="140" rx="95" ry="45" fill="#e8f5e3" stroke="#1d8102" stroke-width="2"/><text x="150" y="137" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d8102">CLOSED</text><text x="150" y="156" font-size="11" text-anchor="middle" fill="#333">calls go through</text>
  <ellipse cx="450" cy="140" rx="95" ry="45" fill="#fdecea" stroke="#d13212" stroke-width="2"/><text x="450" y="137" font-size="16" font-weight="bold" text-anchor="middle" fill="#d13212">OPEN</text><text x="450" y="156" font-size="11" text-anchor="middle" fill="#333">skip model: fail over at once</text>
  <ellipse cx="750" cy="140" rx="95" ry="45" fill="#fff7ec" stroke="#ff9900" stroke-width="2"/><text x="750" y="137" font-size="16" font-weight="bold" text-anchor="middle" fill="#c66c00">HALF_OPEN</text><text x="750" y="156" font-size="11" text-anchor="middle" fill="#333">let ONE probe through</text>
  <path d="M235,115 Q300,70 365,115" fill="none" stroke="#232f3e" stroke-width="1.5" marker-end="url(#a)"/><text x="300" y="72" font-size="12" text-anchor="middle">failures_to_open (3) failed requests</text>
  <path d="M535,115 Q600,70 665,115" fill="none" stroke="#232f3e" stroke-width="1.5" marker-end="url(#a)"/><text x="600" y="72" font-size="12" text-anchor="middle">open_seconds (20 s) passed</text>
  <path d="M665,165 Q600,205 535,165" fill="none" stroke="#d13212" stroke-width="1.5" marker-end="url(#a)"/><text x="600" y="203" font-size="12" text-anchor="middle" fill="#d13212">probe fails → open again</text>
  <path d="M740,175 Q450,370 160,175" fill="none" stroke="#1d8102" stroke-width="1.5" marker-end="url(#a)"/><text x="450" y="300" font-size="12" text-anchor="middle" fill="#1d8102">probe succeeds → closed, counter reset</text>
</svg>
