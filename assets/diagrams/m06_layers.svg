<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker>
  </defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">L3 · respond() — every source gets the control that fits it</text>

  <!-- row A: document lane -->
  <rect x="20" y="70" width="150" height="56" rx="6" fill="#f4f5f7" stroke="#999"/>
  <text x="95" y="94" font-size="13" text-anchor="middle" font-weight="bold">Retrieved document</text>
  <text x="95" y="112" font-size="11" text-anchor="middle" fill="#555">email · web page · file</text>
  <rect x="205" y="70" width="180" height="56" rx="6" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="295" y="91" font-size="13" text-anchor="middle" font-weight="bold">① sanitize (regex)</text>
  <text x="295" y="107" font-size="11" text-anchor="middle" fill="#555">drop comments, hidden-styled</text>
  <text x="295" y="120" font-size="11" text-anchor="middle" fill="#555">elements, tags, zero-width chars</text>
  <rect x="420" y="70" width="200" height="56" rx="6" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="520" y="91" font-size="13" text-anchor="middle" font-weight="bold">② doc-screen guardrail</text>
  <text x="520" y="107" font-size="11" text-anchor="middle" fill="#555">ApplyGuardrail, source INPUT</text>
  <text x="520" y="120" font-size="11" text-anchor="middle" fill="#555">PROMPT_ATTACK filter only</text>
  <rect x="680" y="70" width="260" height="56" rx="6" fill="#fdecea" stroke="#d13212"/>
  <text x="810" y="91" font-size="13" text-anchor="middle" font-weight="bold" fill="#d13212">quarantine</text>
  <text x="810" y="107" font-size="11" text-anchor="middle" fill="#555">no model call · QUARANTINED message</text>
  <text x="810" y="120" font-size="11" text-anchor="middle" fill="#555">a human reviews the document</text>
  <line x1="170" y1="98" x2="203" y2="98" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="385" y1="98" x2="418" y2="98" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="620" y1="98" x2="678" y2="98" stroke="#d13212" marker-end="url(#r)"/>
  <text x="649" y="90" font-size="11" text-anchor="middle" fill="#d13212">hit</text>

  <!-- row B: question lane + Converse -->
  <rect x="20" y="215" width="150" height="56" rx="6" fill="#f4f5f7" stroke="#999"/>
  <text x="95" y="239" font-size="13" text-anchor="middle" font-weight="bold">Customer question</text>
  <text x="95" y="257" font-size="11" text-anchor="middle" fill="#555">untrusted</text>
  <rect x="205" y="215" width="180" height="56" rx="6" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="295" y="237" font-size="13" text-anchor="middle" font-weight="bold">guardContent tag</text>
  <text x="295" y="255" font-size="11" text-anchor="middle" fill="#555">query, guard_content</text>

  <rect x="420" y="170" width="300" height="160" rx="8" fill="#fff7ec" stroke="#ff9900" stroke-width="2"/>
  <text x="570" y="190" font-size="13" text-anchor="middle" font-weight="bold" fill="#c66c00">Converse + guardrailConfig (shield vN)</text>
  <rect x="435" y="200" width="270" height="32" rx="5" fill="#fff" stroke="#ff9900"/>
  <text x="570" y="221" font-size="12" text-anchor="middle">③ input policies on the tagged question</text>
  <rect x="435" y="242" width="270" height="32" rx="5" fill="#232f3e"/>
  <text x="570" y="263" font-size="12" text-anchor="middle" fill="#fff">model: Nova Lite</text>
  <rect x="435" y="284" width="270" height="36" rx="5" fill="#fff" stroke="#ff9900"/>
  <text x="570" y="300" font-size="12" text-anchor="middle">④ output policies + grounding</text>
  <text x="570" y="314" font-size="11" text-anchor="middle" fill="#555">PII mask · topics · content · score vs source</text>
  <line x1="570" y1="232" x2="570" y2="241" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="570" y1="274" x2="570" y2="283" stroke="#232f3e" marker-end="url(#a)"/>

  <line x1="170" y1="243" x2="203" y2="243" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="385" y1="216" x2="433" y2="216" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- doc into converse -->
  <line x1="520" y1="126" x2="520" y2="168" stroke="#232f3e" marker-end="url(#a)"/>
  <text x="528" y="152" font-size="11" fill="#0073bb">pass → grounding_source</text>

  <rect x="755" y="215" width="185" height="56" rx="6" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="847" y="237" font-size="13" text-anchor="middle" font-weight="bold">⑤ link allowlist (app)</text>
  <text x="847" y="255" font-size="11" text-anchor="middle" fill="#555">any non-allowed host → BLOCKED</text>
  <line x1="720" y1="243" x2="753" y2="243" stroke="#232f3e" marker-end="url(#a)"/>
  <rect x="790" y="300" width="115" height="34" rx="6" fill="#e8f5e3" stroke="#1d8102"/>
  <text x="847" y="322" font-size="12" text-anchor="middle" font-weight="bold" fill="#1d8102">answer</text>
  <line x1="847" y1="271" x2="847" y2="298" stroke="#232f3e" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="20" y="355" width="920" height="64" rx="6" fill="#f4f5f7" stroke="#ccc"/>
  <text x="35" y="376" font-size="12"><tspan font-weight="bold">L1</tspan> = system prompt only (delimited document, "data, never instructions", a canary) — no guardrail at all</text>
  <text x="35" y="394" font-size="12"><tspan font-weight="bold">L2</tspan> = L1 + the shield on the whole untagged user message (document included) and on the answer</text>
  <text x="35" y="412" font-size="12"><tspan font-weight="bold">L3</tspan> = this picture: lexical where a rule is exact (①, ⑤), semantic where meaning matters (②, ③, ④)</text>
</svg>
