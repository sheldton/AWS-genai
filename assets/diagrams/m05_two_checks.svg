<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8102"/></marker></defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">Two checks on bind_policy — the policy judges the claim, the tool checks the facts</text>
  <rect x="20" y="60" width="230" height="110" rx="8" fill="#fff7ec" stroke="#ff9900"/>
  <text x="135" y="82" font-size="13" text-anchor="middle" font-weight="bold" fill="#c66c00">bind_policy arguments</text>
  <text x="135" y="98" font-size="11" text-anchor="middle" fill="#555">(written by the model)</text>
  <text x="40" y="122" font-size="12" font-family="Menlo, monospace">customer_id</text>
  <text x="40" y="140" font-size="12" font-family="Menlo, monospace">quote_id  Q-C-2210-…-SIG</text>
  <text x="40" y="158" font-size="12" font-family="Menlo, monospace">premium_usd</text>
  <polygon points="410,65 520,115 410,165 300,115" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="410" y="105" font-size="12" text-anchor="middle" font-weight="bold" fill="#0073bb">Cedar policy</text>
  <text x="410" y="121" font-size="11" text-anchor="middle">premium_usd</text>
  <text x="410" y="135" font-size="11" text-anchor="middle">≤ 2500 ?</text>
  <line x1="250" y1="115" x2="300" y2="115" stroke="#232f3e" marker-end="url(#a)"/>
  <polygon points="690,65 800,115 690,165 580,115" fill="#f1f8fd" stroke="#232f3e"/>
  <text x="690" y="105" font-size="12" text-anchor="middle" font-weight="bold">Lambda</text>
  <text x="690" y="121" font-size="11" text-anchor="middle">signed quote →</text>
  <text x="690" y="135" font-size="11" text-anchor="middle">premium matches?</text>
  <line x1="520" y1="115" x2="580" y2="115" stroke="#1d8102" marker-end="url(#g)"/><text x="550" y="107" font-size="11" text-anchor="middle" fill="#1d8102">yes</text>
  <rect x="830" y="92" width="110" height="46" rx="8" fill="#e8f5e3" stroke="#1d8102"/><text x="885" y="120" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d8102">BOUND</text>
  <line x1="800" y1="115" x2="830" y2="115" stroke="#1d8102" marker-end="url(#g)"/><text x="815" y="107" font-size="11" text-anchor="middle" fill="#1d8102">yes</text>
  <rect x="320" y="200" width="180" height="46" rx="8" fill="#fdecea" stroke="#d13212"/><text x="410" y="219" font-size="12" text-anchor="middle" font-weight="bold" fill="#d13212">REFUSED by gateway</text><text x="410" y="236" font-size="11" text-anchor="middle" fill="#d13212">Lambda never runs</text>
  <line x1="410" y1="165" x2="410" y2="200" stroke="#d13212" marker-end="url(#r)"/><text x="418" y="187" font-size="11" fill="#d13212">no</text>
  <rect x="600" y="200" width="180" height="46" rx="8" fill="#fdecea" stroke="#d13212"/><text x="690" y="219" font-size="12" text-anchor="middle" font-weight="bold" fill="#d13212">REJECTED by the tool</text><text x="690" y="236" font-size="11" text-anchor="middle" fill="#d13212">PREMIUM_MISMATCH / …</text>
  <line x1="690" y1="165" x2="690" y2="200" stroke="#d13212" marker-end="url(#r)"/><text x="698" y="187" font-size="11" fill="#d13212">no</text>
  <!-- table -->
  <text x="20" y="282" font-size="13" font-weight="bold" fill="#232f3e">The four bind cases of the §3 matrix under ENFORCE</text>
  <rect x="20" y="292" width="920" height="24" fill="#232f3e"/>
  <text x="30" y="309" font-size="12" fill="#fff" font-weight="bold">case</text>
  <text x="330" y="309" font-size="12" fill="#fff" font-weight="bold">Cedar policy (claimed premium)</text>
  <text x="590" y="309" font-size="12" fill="#fff" font-weight="bold">Lambda (real premium)</text>
  <text x="800" y="309" font-size="12" fill="#fff" font-weight="bold">result</text>
  <rect x="20" y="316" width="920" height="24" fill="#f1f8fd"/>
  <text x="30" y="333" font-size="12">bind 630 USD (legitimate)</text><text x="330" y="333" font-size="12" fill="#1d8102">permit (630 ≤ 2500)</text><text x="590" y="333" font-size="12" fill="#1d8102">matches the signed quote</text><text x="800" y="333" font-size="12" fill="#1d8102" font-weight="bold">BOUND</text>
  <text x="30" y="357" font-size="12">bind 9,840 USD (the attack)</text><text x="330" y="357" font-size="12" fill="#d13212">no permit → deny by default</text><text x="590" y="357" font-size="12" fill="#555">— not called —</text><text x="800" y="357" font-size="12" fill="#d13212" font-weight="bold">REFUSED</text>
  <rect x="20" y="364" width="920" height="24" fill="#f1f8fd"/>
  <text x="30" y="381" font-size="12">9,840 quote, model claims 2,400</text><text x="330" y="381" font-size="12" fill="#1d8102">permit (2,400 ≤ 2500)</text><text x="590" y="381" font-size="12" fill="#d13212">9,840 ≠ 2,400</text><text x="800" y="381" font-size="12" fill="#d13212" font-weight="bold">REJECTED</text>
  <text x="30" y="405" font-size="12">exactly 2,500, unknown quote</text><text x="330" y="405" font-size="12" fill="#1d8102">permit (boundary inclusive)</text><text x="590" y="405" font-size="12" fill="#d13212">quote not issued for customer</text><text x="800" y="405" font-size="12" fill="#d13212" font-weight="bold">REJECTED</text>
</svg>
