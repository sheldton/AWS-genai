<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker></defs>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#232f3e">Prompt caching — what a cachePoint does to one request</text>
  <!-- request layout -->
  <text x="20" y="62" font-size="12" fill="#555">Converse request</text>
  <rect x="20" y="72" width="560" height="50" rx="6" fill="#e8f5e3" stroke="#1d8102"/>
  <text x="300" y="94" font-size="13" text-anchor="middle" font-weight="bold">system: static prefix ≈ 5,250 tokens</text>
  <text x="300" y="111" font-size="11" text-anchor="middle" fill="#555">role · policy wordings · claims manual · approved-answer library — byte-identical every time</text>
  <rect x="590" y="72" width="120" height="50" rx="6" fill="#ff9900"/>
  <text x="650" y="94" font-size="12" text-anchor="middle" fill="#232f3e" font-weight="bold">cachePoint</text>
  <text x="650" y="110" font-size="11" text-anchor="middle" fill="#232f3e">{"type":"default"}</text>
  <rect x="720" y="72" width="220" height="50" rx="6" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="830" y="94" font-size="13" text-anchor="middle">user: the question</text>
  <text x="830" y="111" font-size="11" text-anchor="middle" fill="#555">≈ 10–20 tokens, changes</text>
  <!-- first / later -->
  <rect x="20" y="160" width="440" height="80" rx="8" fill="#fff" stroke="#232f3e"/>
  <text x="35" y="182" font-size="13" font-weight="bold">1st request (cold) → cache write</text>
  <text x="35" y="201" font-size="11" fill="#555">usage.cacheWriteInputTokens ≈ prefix size</text>
  <text x="35" y="217" font-size="11" fill="#555">on Nova: a write costs no more than normal input</text>
  <text x="35" y="233" font-size="11" fill="#555">the processed prefix is kept for a few minutes</text>
  <rect x="500" y="160" width="440" height="80" rx="8" fill="#fff" stroke="#1d8102"/>
  <text x="515" y="182" font-size="13" font-weight="bold" fill="#1d8102">later requests, same prefix → cache read</text>
  <text x="515" y="201" font-size="11" fill="#555">usage.cacheReadInputTokens ≈ prefix, billed at ¼ input price</text>
  <text x="515" y="217" font-size="11" fill="#555">usage.inputTokens = only the part after the cachePoint</text>
  <text x="515" y="233" font-size="11" fill="#555">the time-to-live restarts on every hit</text>
  <line x1="300" y1="122" x2="240" y2="160" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="460" y1="200" x2="500" y2="200" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- traps -->
  <rect x="20" y="258" width="920" height="60" rx="8" fill="#fdecea" stroke="#d13212"/>
  <text x="35" y="280" font-size="13" font-weight="bold" fill="#d13212">Silent misses (the call succeeds, cache tokens = 0, full price)</text>
  <text x="35" y="300" font-size="11">prefix above the model's maximum cacheable size (or below a minimum) · any byte changed before the cachePoint (a date, a request id) ·</text>
  <text x="35" y="314" font-size="11">us. cross-Region profile: the request may land in a Region whose cache is still cold — each Region keeps its own cache</text>
</svg>
