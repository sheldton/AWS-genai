<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="360" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0073bb"/></marker></defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">One agent request: the span tree (client) vs the invocation log (service)</text>
  <text x="20" y="52" font-size="11" fill="#555">time →  (bar lengths are illustrative)</text>

  <!-- span bars -->
  <rect x="20" y="64" width="600" height="26" rx="4" fill="#232f3e"/>
  <text x="30" y="82" font-size="12" fill="#fff">invoke_agent — whole request, total tokens</text>

  <rect x="40" y="100" width="160" height="22" rx="4" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="48" y="115" font-size="11">execute_event_loop_cycle</text>
  <rect x="210" y="100" width="190" height="22" rx="4" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="218" y="115" font-size="11">execute_event_loop_cycle</text>
  <rect x="410" y="100" width="210" height="22" rx="4" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="418" y="115" font-size="11">execute_event_loop_cycle</text>

  <rect x="50" y="132" width="146" height="22" rx="4" fill="#fff7ec" stroke="#ff9900"/>
  <text x="58" y="147" font-size="11">chat 1 · tool_use</text>
  <rect x="220" y="132" width="176" height="22" rx="4" fill="#fff7ec" stroke="#ff9900"/>
  <text x="228" y="147" font-size="11">chat 2 · more input · tool_use</text>
  <rect x="420" y="132" width="196" height="22" rx="4" fill="#fff7ec" stroke="#ff9900"/>
  <text x="428" y="147" font-size="11">chat 3 · most input · end_turn</text>

  <rect x="196" y="164" width="6" height="22" fill="#1d8102"/>
  <text x="128" y="200" font-size="11" fill="#1d8102">execute_tool lookup_policy (≈ 1 ms)</text>
  <rect x="396" y="164" width="6" height="22" fill="#1d8102"/>
  <text x="330" y="218" font-size="11" fill="#1d8102">execute_tool nights_cost (≈ 1 ms)</text>

  <!-- log records -->
  <rect x="660" y="64" width="280" height="160" rx="8" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="800" y="86" font-size="13" font-weight="bold" text-anchor="middle" fill="#0073bb">Invocation log records</text>
  <text x="800" y="103" font-size="11" text-anchor="middle" fill="#555">filter requestMetadata.session = …</text>
  <rect x="675" y="114" width="250" height="24" rx="4" fill="#fff" stroke="#0073bb"/>
  <text x="685" y="130" font-size="11">record 1 · tokens · tool_use  ↔ chat 1</text>
  <rect x="675" y="144" width="250" height="24" rx="4" fill="#fff" stroke="#0073bb"/>
  <text x="685" y="160" font-size="11">record 2 · tokens · tool_use  ↔ chat 2</text>
  <rect x="675" y="174" width="250" height="24" rx="4" fill="#fff" stroke="#0073bb"/>
  <text x="685" y="190" font-size="11">record 3 · tokens · end_turn  ↔ chat 3</text>
  <text x="800" y="215" font-size="11" text-anchor="middle" fill="#d13212">+ errorCode records (retried throttles)</text>


  <line x1="620" y1="143" x2="656" y2="143" stroke="#0073bb" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="178" font-size="11" fill="#0073bb">pair span ↔ record</text>
  <text x="560" y="192" font-size="11" fill="#0073bb">by input tokens</text>
  <!-- notes -->
  <rect x="20" y="262" width="920" height="80" rx="8" fill="#fff7ec" stroke="#ff9900"/>
  <text x="35" y="284" font-size="12" fill="#232f3e"><tspan font-weight="bold">Pairing:</tspan> each cycle re-sends the whole conversation, so input tokens grow — equal input-token counts identify the pair.</text>
  <text x="35" y="304" font-size="12" fill="#232f3e"><tspan font-weight="bold">Spans</tspan> (client, OpenTelemetry GenAI attributes) show where the time went: model calls, not tools.</text>
  <text x="35" y="324" font-size="12" fill="#232f3e"><tspan font-weight="bold">Records</tspan> (service) are what was billed, and also list failed attempts the SDK retried — bill from the log.</text>
</svg>
