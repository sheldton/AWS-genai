<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
        <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0073bb"/></marker></defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">Invocation logging — from a tagged call to a cost per tenant</text>

  <!-- application -->
  <rect x="20" y="60" width="200" height="120" rx="8" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="120" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#0073bb">Application</text>
  <text x="120" y="102" font-size="11" text-anchor="middle">converse(modelId, messages,</text>
  <text x="120" y="117" font-size="11" text-anchor="middle">requestMetadata={tenant,</text>
  <text x="120" y="132" font-size="11" text-anchor="middle">feature, run})</text>
  <text x="120" y="158" font-size="11" text-anchor="middle" fill="#555">keeps RequestId + usage</text>

  <!-- bedrock -->
  <rect x="300" y="60" width="200" height="120" rx="8" fill="#232f3e"/>
  <text x="400" y="86" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Amazon Bedrock</text>
  <text x="400" y="108" font-size="11" text-anchor="middle" fill="#fff">requestMetadata is not</text>
  <text x="400" y="123" font-size="11" text-anchor="middle" fill="#fff">sent to the model</text>
  <text x="400" y="150" font-size="11" text-anchor="middle" fill="#ff9900">one logging config per</text>
  <text x="400" y="165" font-size="11" text-anchor="middle" fill="#ff9900">account and Region</text>

  <line x1="220" y1="105" x2="298" y2="105" stroke="#232f3e" marker-end="url(#a)"/>
  <text x="259" y="98" font-size="11" text-anchor="middle" fill="#555">call</text>
  <line x1="298" y1="140" x2="222" y2="140" stroke="#232f3e" marker-end="url(#a)"/>
  <text x="259" y="156" font-size="11" text-anchor="middle" fill="#555">answer</text>

  <!-- role -->
  <rect x="300" y="215" width="200" height="60" rx="8" fill="#fff7ec" stroke="#ff9900"/>
  <text x="400" y="237" font-size="12" font-weight="bold" text-anchor="middle" fill="#c66c00">IAM role (assumed by Bedrock)</text>
  <text x="400" y="254" font-size="11" text-anchor="middle">trust: SourceAccount + SourceArn</text>
  <text x="400" y="268" font-size="11" text-anchor="middle">may write one log stream</text>
  <line x1="400" y1="180" x2="400" y2="213" stroke="#232f3e" marker-end="url(#a)"/>

  <!-- log group -->
  <rect x="580" y="60" width="360" height="215" rx="8" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="760" y="82" font-size="13" font-weight="bold" text-anchor="middle" fill="#0073bb">CloudWatch Logs — the invocation log</text>
  <text x="760" y="99" font-size="11" text-anchor="middle" fill="#555">retention 3 days · data protection: e-mail masked</text>
  <rect x="600" y="110" width="320" height="150" rx="6" fill="#fff" stroke="#0073bb"/>
  <text x="615" y="130" font-size="11" font-family="Menlo, Courier, monospace">{ requestId, modelId, identity.arn,</text>
  <text x="630" y="147" font-size="11" font-family="Menlo, Courier, monospace">inferenceRegion, errorCode?,</text>
  <text x="630" y="164" font-size="11" font-family="Menlo, Courier, monospace" fill="#c66c00">requestMetadata.{tenant, feature},</text>
  <text x="630" y="181" font-size="11" font-family="Menlo, Courier, monospace">input.inputTokenCount,</text>
  <text x="630" y="198" font-size="11" font-family="Menlo, Courier, monospace">input.inputBodyJson (the prompt),</text>
  <text x="630" y="215" font-size="11" font-family="Menlo, Courier, monospace">output.outputTokenCount,</text>
  <text x="630" y="232" font-size="11" font-family="Menlo, Courier, monospace">output.outputBodyJson.{stopReason,</text>
  <text x="645" y="249" font-size="11" font-family="Menlo, Courier, monospace">metrics.latencyMs} }</text>
  <line x1="500" y1="245" x2="578" y2="245" stroke="#232f3e" marker-end="url(#a)"/>
  <text x="539" y="238" font-size="11" text-anchor="middle" fill="#555">writes</text>

  <!-- insights -->
  <rect x="580" y="305" width="360" height="60" rx="8" fill="#e8f5e3" stroke="#1d8102"/>
  <text x="760" y="327" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d8102">Logs Insights: StartQuery → GetQueryResults</text>
  <text x="760" y="345" font-size="11" text-anchor="middle">stats … by requestMetadata.tenant, modelId → × price in code</text>
  <line x1="760" y1="277" x2="760" y2="303" stroke="#1d8102" marker-end="url(#a)"/>

  <!-- reconciliation -->
  <rect x="20" y="305" width="480" height="60" rx="8" fill="#fdecea" stroke="#d13212"/>
  <text x="260" y="327" font-size="12" font-weight="bold" text-anchor="middle" fill="#d13212">Reconcile before you trust the log</text>
  <text x="260" y="345" font-size="11" text-anchor="middle">client RequestId = record requestId? client usage = logged tokens?</text>
  <line x1="120" y1="180" x2="120" y2="303" stroke="#0073bb" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <line x1="578" y1="335" x2="502" y2="335" stroke="#0073bb" stroke-dasharray="4 3" marker-end="url(#b)"/>
</svg>
