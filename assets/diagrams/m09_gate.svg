<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker></defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">The correctness rule — cluster bootstrap and a non-inferiority margin</text>

  <!-- step 1 -->
  <rect x="20" y="50" width="280" height="180" rx="10" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="35" y="72" font-size="13" font-weight="bold" fill="#0073bb">1 · one difference per question</text>
  <text x="35" y="96" font-size="11">question q (20 of them):</text>
  <text x="35" y="116" font-size="11" font-family="Menlo, Courier, monospace">v1: score₁ score₂ → mean</text>
  <text x="35" y="134" font-size="11" font-family="Menlo, Courier, monospace">v2: score₁ score₂ → mean</text>
  <text x="35" y="158" font-size="11" font-family="Menlo, Courier, monospace">d_q = mean(v2) − mean(v1)</text>
  <text x="35" y="186" font-size="11" fill="#555">the two samples of a question share its</text>
  <text x="35" y="201" font-size="11" fill="#555">difficulty: they are one cluster, not two</text>
  <text x="35" y="216" font-size="11" fill="#555">independent data points</text>

  <!-- step 2 -->
  <rect x="330" y="50" width="280" height="180" rx="10" fill="#fff7ec" stroke="#ff9900"/>
  <text x="345" y="72" font-size="13" font-weight="bold" fill="#c66c00">2 · resample questions</text>
  <text x="345" y="96" font-size="11">draw 20 of the 20 d_q values with</text>
  <text x="345" y="111" font-size="11">replacement, take the mean</text>
  <text x="345" y="136" font-size="11">repeat 5,000 times → 5,000 means</text>
  <text x="345" y="161" font-size="11">95 % CI = 2.5th … 97.5th percentile</text>
  <text x="345" y="186" font-size="11" fill="#555">resampling the 40 answers instead</text>
  <text x="345" y="201" font-size="11" fill="#555">would pretend there is twice as much</text>
  <text x="345" y="216" font-size="11" fill="#555">data — an interval that is too narrow</text>

  <!-- step 3 -->
  <rect x="640" y="50" width="300" height="180" rx="10" fill="#e8f5e3" stroke="#1d8102"/>
  <text x="655" y="72" font-size="13" font-weight="bold" fill="#1d8102">3 · compare with the rule</text>
  <text x="655" y="96" font-size="11">non-inferiority: v2 may be a bit worse,</text>
  <text x="655" y="111" font-size="11">but not by more than the margin</text>
  <text x="655" y="136" font-size="11" font-weight="bold">PASS if lower bound &gt; −0.5</text>
  <text x="655" y="161" font-size="11">the margin is written before the run —</text>
  <text x="655" y="176" font-size="11">and wider than the noise of 20 questions</text>
  <text x="655" y="201" font-size="11">contract and token rules are checked</text>
  <text x="655" y="216" font-size="11">next to it; every rule must pass</text>

  <line x1="300" y1="140" x2="328" y2="140" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="610" y1="140" x2="638" y2="140" stroke="#232f3e" marker-end="url(#a)"/>

  <!-- number line with three CI examples -->
  <text x="20" y="262" font-size="12" font-weight="bold" fill="#232f3e">Three possible intervals for mean(v2 − v1) (illustrative):</text>
  <line x1="120" y1="350" x2="900" y2="350" stroke="#232f3e"/>
  <line x1="380" y1="270" x2="380" y2="355" stroke="#d13212" stroke-width="2"/>
  <text x="380" y="370" font-size="11" text-anchor="middle" fill="#d13212">−0.5 margin</text>
  <line x1="640" y1="270" x2="640" y2="355" stroke="#232f3e" stroke-dasharray="3 3"/>
  <text x="640" y="370" font-size="11" text-anchor="middle">0 (no change)</text>
  <text x="120" y="370" font-size="11" text-anchor="middle">−1.0</text>
  <text x="900" y="370" font-size="11" text-anchor="middle">+0.5</text>

  <line x1="458" y1="285" x2="770" y2="285" stroke="#1d8102" stroke-width="6"/>
  <text x="780" y="289" font-size="11" fill="#1d8102">✓ non-inferior</text>
  <line x1="302" y1="310" x2="666" y2="310" stroke="#d13212" stroke-width="6"/>
  <text x="676" y="314" font-size="11" fill="#d13212">✗ crosses the margin → FAIL</text>
  <line x1="666" y1="335" x2="848" y2="335" stroke="#0073bb" stroke-width="6"/>
  <text x="856" y="339" font-size="11" fill="#0073bb">✓ better</text>
</svg>
