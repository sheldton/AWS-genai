<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker></defs>
  <text x="20" y="22" font-size="17" font-weight="bold" fill="#232f3e">Gateway.invoke(route) — what happens to one request</text>
  <rect x="20" y="110" width="130" height="56" rx="8" fill="#f1f8fd" stroke="#0073bb"/><text x="85" y="134" font-size="13" text-anchor="middle">next model</text><text x="85" y="151" font-size="11" text-anchor="middle" fill="#555">in the route's chain</text>
  <polygon points="250,95 320,138 250,181 180,138" fill="#fff" stroke="#232f3e"/><text x="250" y="135" font-size="12" text-anchor="middle">breaker</text><text x="250" y="150" font-size="12" text-anchor="middle">allows?</text>
  <rect x="360" y="110" width="130" height="56" rx="8" fill="#232f3e"/><text x="425" y="134" font-size="13" text-anchor="middle" fill="#fff">Converse</text><text x="425" y="151" font-size="11" text-anchor="middle" fill="#ddd">no SDK retries</text>
  <rect x="560" y="45" width="150" height="44" rx="8" fill="#e8f5e3" stroke="#1d8102"/><text x="635" y="72" font-size="13" text-anchor="middle" fill="#1d8102">OK → return</text>
  <polygon points="635,105 710,138 635,171 560,138" fill="#fff" stroke="#232f3e"/><text x="635" y="135" font-size="12" text-anchor="middle">classify</text><text x="635" y="150" font-size="12" text-anchor="middle">the error</text>
  <rect x="770" y="45" width="170" height="54" rx="8" fill="#fff7ec" stroke="#ff9900"/><text x="855" y="66" font-size="12" text-anchor="middle" font-weight="bold">retry</text><text x="855" y="83" font-size="11" text-anchor="middle">throttling · 5xx · timeout</text><text x="855" y="96" font-size="10" text-anchor="middle" fill="#555">sleep U(0, min(cap, base·2ⁿ))</text>
  <rect x="770" y="113" width="170" height="50" rx="8" fill="#f1f8fd" stroke="#0073bb"/><text x="855" y="134" font-size="12" text-anchor="middle" font-weight="bold">fail over</text><text x="855" y="151" font-size="11" text-anchor="middle">retries used up → next model</text>
  <rect x="770" y="178" width="170" height="54" rx="8" fill="#fdecea" stroke="#d13212"/><text x="855" y="199" font-size="12" text-anchor="middle" font-weight="bold">fail fast</text><text x="855" y="216" font-size="11" text-anchor="middle">ValidationException ·</text><text x="855" y="229" font-size="11" text-anchor="middle">AccessDenied — our bug</text>
  <line x1="150" y1="138" x2="180" y2="138" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="320" y1="138" x2="360" y2="138" stroke="#232f3e" marker-end="url(#a)"/><text x="340" y="130" font-size="11" text-anchor="middle">yes</text>
  <path d="M250,181 L250,250 L85,250 L85,166" fill="none" stroke="#d13212" marker-end="url(#a)"/><text x="170" y="265" font-size="11" text-anchor="middle" fill="#d13212">no (OPEN) → skip to next model</text>
  <path d="M490,125 L560,70" fill="none" stroke="#1d8102" marker-end="url(#a)"/>
  <line x1="490" y1="145" x2="560" y2="140" stroke="#232f3e" marker-end="url(#a)"/><text x="522" y="160" font-size="11" text-anchor="middle">error</text>
  <line x1="710" y1="130" x2="770" y2="75" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="710" y1="138" x2="770" y2="138" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="710" y1="146" x2="770" y2="200" stroke="#232f3e" marker-end="url(#a)"/>
  <path d="M855,45 L855,38 L425,38 L425,110" fill="none" stroke="#ff9900" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="478" y="52" font-size="11" text-anchor="middle" fill="#c66c00">same model again</text>
  <path d="M940,138 L950,138 L950,285 L60,285 L60,166" fill="none" stroke="#0073bb" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
