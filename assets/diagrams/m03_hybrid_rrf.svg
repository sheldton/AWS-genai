<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
  </defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">Hybrid retrieval — fuse by rank, then let a cross-encoder read</text>
  <text x="940" y="30" font-size="11" text-anchor="end" fill="#555">illustrative example (chunks A–F)</text>

  <!-- panel 1: two lists -->
  <rect x="20" y="50" width="280" height="250" rx="10" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="35" y="72" font-size="13" font-weight="bold" fill="#0073bb">1 · two ranked lists</text>
  <text x="90" y="98" font-size="12" text-anchor="middle" font-weight="bold">vector</text>
  <text x="230" y="98" font-size="12" text-anchor="middle" font-weight="bold">BM25</text>
  <text x="90" y="113" font-size="10" text-anchor="middle" fill="#555">cosine, meaning</text>
  <text x="230" y="113" font-size="10" text-anchor="middle" fill="#555">exact terms, identifiers</text>
  <g font-size="12">
    <rect x="45" y="125" width="90" height="30" rx="5" fill="#fff" stroke="#0073bb"/><text x="58" y="145" fill="#555">1</text><text x="100" y="145" text-anchor="middle" font-weight="bold">A</text>
    <rect x="45" y="162" width="90" height="30" rx="5" fill="#fff" stroke="#0073bb"/><text x="58" y="182" fill="#555">2</text><text x="100" y="182" text-anchor="middle" font-weight="bold">B</text>
    <rect x="45" y="199" width="90" height="30" rx="5" fill="#fff" stroke="#0073bb"/><text x="58" y="219" fill="#555">3</text><text x="100" y="219" text-anchor="middle" font-weight="bold">C</text>
    <rect x="45" y="236" width="90" height="30" rx="5" fill="#fff" stroke="#0073bb"/><text x="58" y="256" fill="#555">4</text><text x="100" y="256" text-anchor="middle" font-weight="bold">D</text>
    <rect x="185" y="125" width="90" height="30" rx="5" fill="#fff" stroke="#0073bb"/><text x="198" y="145" fill="#555">1</text><text x="240" y="145" text-anchor="middle" font-weight="bold">C</text>
    <rect x="185" y="162" width="90" height="30" rx="5" fill="#fff" stroke="#0073bb"/><text x="198" y="182" fill="#555">2</text><text x="240" y="182" text-anchor="middle" font-weight="bold">E</text>
    <rect x="185" y="199" width="90" height="30" rx="5" fill="#fff" stroke="#0073bb"/><text x="198" y="219" fill="#555">3</text><text x="240" y="219" text-anchor="middle" font-weight="bold">A</text>
    <rect x="185" y="236" width="90" height="30" rx="5" fill="#fff" stroke="#0073bb"/><text x="198" y="256" fill="#555">4</text><text x="240" y="256" text-anchor="middle" font-weight="bold">F</text>
  </g>
  <text x="160" y="288" font-size="11" text-anchor="middle" fill="#555">scores live on different scales — ignore them</text>

  <!-- panel 2: RRF -->
  <rect x="330" y="50" width="290" height="250" rx="10" fill="#fff" stroke="#232f3e"/>
  <text x="345" y="72" font-size="13" font-weight="bold" fill="#232f3e">2 · reciprocal rank fusion</text>
  <text x="475" y="96" font-size="12" text-anchor="middle">score = Σ over lists of 1 / (60 + rank)</text>
  <g font-size="12">
    <text x="350" y="126" font-weight="bold">A</text><text x="375" y="126">1/61 + 1/63</text><text x="600" y="126" text-anchor="end">0.0323</text>
    <text x="350" y="150" font-weight="bold">C</text><text x="375" y="150">1/63 + 1/61</text><text x="600" y="150" text-anchor="end">0.0323</text>
    <text x="350" y="174" font-weight="bold">B</text><text x="375" y="174">1/62</text><text x="600" y="174" text-anchor="end">0.0161</text>
    <text x="350" y="198" font-weight="bold">E</text><text x="375" y="198">1/62</text><text x="600" y="198" text-anchor="end">0.0161</text>
    <text x="350" y="222" font-weight="bold">D</text><text x="375" y="222">1/64</text><text x="600" y="222" text-anchor="end">0.0156</text>
    <text x="350" y="246" font-weight="bold">F</text><text x="375" y="246">1/64</text><text x="600" y="246" text-anchor="end">0.0156</text>
  </g>
  <line x1="345" y1="134" x2="605" y2="134" stroke="#ddd"/>
  <line x1="345" y1="158" x2="605" y2="158" stroke="#ddd"/>
  <text x="475" y="276" font-size="11" text-anchor="middle" fill="#555">found by both lists → on top; the pool keeps</text>
  <text x="475" y="290" font-size="11" text-anchor="middle" fill="#555">every candidate (POOL = 20 in the notebook)</text>

  <!-- panel 3: rerank -->
  <rect x="650" y="50" width="290" height="250" rx="10" fill="#fff7ec" stroke="#ff9900"/>
  <text x="665" y="72" font-size="13" font-weight="bold" fill="#c66c00">3 · rerank (cross-encoder)</text>
  <text x="795" y="96" font-size="12" text-anchor="middle">reads question + chunk together,</text>
  <text x="795" y="112" font-size="12" text-anchor="middle">one relevance score per pair</text>
  <g font-size="12">
    <rect x="670" y="125" width="250" height="28" rx="5" fill="#e8f5e3" stroke="#1d8102"/><text x="685" y="144" font-weight="bold">E</text><text x="905" y="144" text-anchor="end">high</text>
    <rect x="670" y="160" width="250" height="28" rx="5" fill="#fff" stroke="#ff9900"/><text x="685" y="179" font-weight="bold">A</text><text x="905" y="179" text-anchor="end">medium</text>
    <rect x="670" y="195" width="250" height="28" rx="5" fill="#fff" stroke="#ff9900"/><text x="685" y="214" font-weight="bold">C</text><text x="905" y="214" text-anchor="end">low</text>
  </g>
  <text x="795" y="250" font-size="11" text-anchor="middle" fill="#555">keep the top K (5): a chunk that was 4th</text>
  <text x="795" y="264" font-size="11" text-anchor="middle" fill="#555">after fusion can become 1st</text>
  <text x="795" y="288" font-size="11" text-anchor="middle" fill="#555">bedrock-agent-runtime rerank · Cohere Rerank 3.5</text>

  <line x1="300" y1="175" x2="330" y2="175" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="175" x2="650" y2="175" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/>

  <!-- encoders -->
  <rect x="20" y="320" width="450" height="96" rx="10" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="35" y="342" font-size="13" font-weight="bold" fill="#0073bb">bi-encoder (Titan V2 embeddings)</text>
  <text x="35" y="364" font-size="12">question → vector; chunk → vector, computed once at ingestion</text>
  <text x="35" y="384" font-size="12">compare by cosine: fast over millions of chunks</text>
  <text x="35" y="404" font-size="12" fill="#555">never sees question and chunk side by side</text>
  <rect x="490" y="320" width="450" height="96" rx="10" fill="#fff7ec" stroke="#ff9900"/>
  <text x="505" y="342" font-size="13" font-weight="bold" fill="#c66c00">cross-encoder (reranker)</text>
  <text x="505" y="364" font-size="12">(question, chunk) → one score, computed per query</text>
  <text x="505" y="384" font-size="12">far more precise, far more expensive per candidate</text>
  <text x="505" y="404" font-size="12" fill="#555">so: retrieve wide and cheap, rerank narrow</text>
</svg>
