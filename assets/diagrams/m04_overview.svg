<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="340" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker></defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">M04 at a glance — measure the prompt, govern it, orchestrate it, release it safely</text>
  <!-- §1 -->
  <rect x="20" y="55" width="200" height="265" rx="10" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="35" y="80" font-size="14" font-weight="bold" fill="#0073bb">§1 Techniques</text>
  <rect x="35" y="95" width="170" height="44" rx="6" fill="#fff" stroke="#0073bb"/><text x="120" y="114" font-size="12" text-anchor="middle">18 golden messages</text><text x="120" y="130" font-size="11" text-anchor="middle" fill="#555">4 labels, built-in traps</text>
  <rect x="35" y="155" width="170" height="58" rx="6" fill="#fff" stroke="#0073bb"/><text x="120" y="173" font-size="12" text-anchor="middle">zero-shot · few-shot</text><text x="120" y="189" font-size="12" text-anchor="middle">chain-of-thought</text><text x="120" y="205" font-size="12" text-anchor="middle">structured (tool schema)</text>
  <rect x="35" y="229" width="170" height="44" rx="6" fill="#fff" stroke="#0073bb"/><text x="120" y="248" font-size="12" text-anchor="middle">× Nova Micro / Lite</text><text x="120" y="264" font-size="11" text-anchor="middle" fill="#555">Wilson CI · McNemar · $</text>
  <text x="120" y="302" font-size="11" text-anchor="middle" fill="#0073bb">model describes, code decides</text>
  <line x1="120" y1="139" x2="120" y2="155" stroke="#232f3e" marker-end="url(#a)"/><line x1="120" y1="213" x2="120" y2="229" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- §2 -->
  <rect x="250" y="55" width="210" height="265" rx="10" fill="#fff7ec" stroke="#ff9900"/>
  <text x="265" y="80" font-size="14" font-weight="bold" fill="#c66c00">§2 Prompt Management</text>
  <rect x="265" y="95" width="180" height="44" rx="6" fill="#fff" stroke="#ff9900"/><text x="355" y="114" font-size="12" text-anchor="middle">prompt + DRAFT</text><text x="355" y="130" font-size="11" text-anchor="middle" fill="#555">variants: lite · micro</text>
  <rect x="265" y="155" width="180" height="44" rx="6" fill="#fff" stroke="#ff9900"/><text x="355" y="174" font-size="12" text-anchor="middle">immutable version N</text><text x="355" y="190" font-size="11" text-anchor="middle" fill="#555">content hash → no duplicates</text>
  <rect x="265" y="215" width="180" height="44" rx="6" fill="#fff" stroke="#ff9900"/><text x="355" y="234" font-size="12" text-anchor="middle">Converse(modelId =</text><text x="355" y="250" font-size="12" text-anchor="middle">prompt version ARN)</text>
  <text x="355" y="290" font-size="11" text-anchor="middle" fill="#c66c00">5 prompts: triage, 3 specialists,</text><text x="355" y="305" font-size="11" text-anchor="middle" fill="#c66c00">clarifier</text>
  <line x1="355" y1="139" x2="355" y2="155" stroke="#232f3e" marker-end="url(#a)"/><line x1="355" y1="199" x2="355" y2="215" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- §3 -->
  <rect x="490" y="55" width="220" height="265" rx="10" fill="#f1f8fd" stroke="#232f3e"/>
  <text x="505" y="80" font-size="14" font-weight="bold" fill="#232f3e">§3 Bedrock Flow in code</text>
  <rect x="505" y="95" width="190" height="30" rx="6" fill="#fff" stroke="#232f3e"/><text x="600" y="115" font-size="12" text-anchor="middle">Triage prompt node</text>
  <rect x="505" y="137" width="190" height="30" rx="6" fill="#fff" stroke="#232f3e"/><text x="600" y="157" font-size="12" text-anchor="middle">Lambda: rules + CRM</text>
  <rect x="505" y="179" width="190" height="30" rx="6" fill="#fff" stroke="#232f3e"/><text x="600" y="199" font-size="12" text-anchor="middle">Condition node: route</text>
  <rect x="505" y="221" width="190" height="30" rx="6" fill="#fff" stroke="#232f3e"/><text x="600" y="241" font-size="12" text-anchor="middle">specialist prompt nodes</text>
  <line x1="600" y1="125" x2="600" y2="137" stroke="#232f3e" marker-end="url(#a)"/><line x1="600" y1="167" x2="600" y2="179" stroke="#232f3e" marker-end="url(#a)"/><line x1="600" y1="209" x2="600" y2="221" stroke="#232f3e" marker-end="url(#a)"/>
  <text x="600" y="282" font-size="11" text-anchor="middle" fill="#232f3e">version + alias live</text>
  <text x="600" y="298" font-size="11" text-anchor="middle" fill="#232f3e">InvokeFlow with per-node trace</text>
  <!-- §4 -->
  <rect x="740" y="55" width="200" height="265" rx="10" fill="#e8f5e3" stroke="#1d8102"/>
  <text x="755" y="80" font-size="14" font-weight="bold" fill="#1d8102">§4 Release safely</text>
  <text x="840" y="112" font-size="12" text-anchor="middle">baseline: golden set</text>
  <text x="840" y="128" font-size="12" text-anchor="middle">through alias live</text>
  <text x="840" y="160" font-size="12" text-anchor="middle">trimmed prompt v2</text>
  <text x="840" y="176" font-size="12" text-anchor="middle">→ flow version 2</text>
  <rect x="765" y="195" width="150" height="34" rx="6" fill="#fdecea" stroke="#d13212"/><text x="840" y="217" font-size="12" text-anchor="middle" fill="#d13212">gate: no golden breaks</text>
  <text x="840" y="258" font-size="12" text-anchor="middle" font-weight="bold">rollback =</text>
  <text x="840" y="275" font-size="12" text-anchor="middle" font-weight="bold">move the alias</text>
  <line x1="220" y1="188" x2="250" y2="188" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="188" x2="490" y2="188" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="188" x2="740" y2="188" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/>
</svg>
