<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker></defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#232f3e">M01 at a glance — measure, then route, then protect</text>
  <!-- section 1 -->
  <rect x="20" y="55" width="280" height="250" rx="10" fill="#f1f8fd" stroke="#0073bb"/>
  <text x="35" y="80" font-size="14" font-weight="bold" fill="#0073bb">§1 Evaluation harness</text>
  <rect x="40" y="95" width="240" height="40" rx="6" fill="#fff" stroke="#0073bb"/><text x="160" y="120" font-size="13" text-anchor="middle">12 tasks with code graders</text>
  <rect x="40" y="150" width="240" height="40" rx="6" fill="#fff" stroke="#0073bb"/><text x="160" y="168" font-size="13" text-anchor="middle">× 6 models via ConverseStream</text><text x="160" y="183" font-size="11" text-anchor="middle" fill="#555">TTFT · latency · tokens · $</text>
  <rect x="40" y="205" width="240" height="40" rx="6" fill="#fff" stroke="#0073bb"/><text x="160" y="223" font-size="13" text-anchor="middle">Scorecard + Wilson CIs</text><text x="160" y="238" font-size="11" text-anchor="middle" fill="#555">McNemar · Pareto frontier</text>
  <text x="160" y="285" font-size="12" text-anchor="middle" fill="#0073bb">output: cheapest model per task kind</text>
  <line x1="160" y1="135" x2="160" y2="150" stroke="#232f3e" marker-end="url(#a)"/><line x1="160" y1="190" x2="160" y2="205" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- section 2 -->
  <rect x="340" y="55" width="400" height="250" rx="10" fill="#fff7ec" stroke="#ff9900"/>
  <text x="355" y="80" font-size="14" font-weight="bold" fill="#c66c00">§2 Provider-agnostic gateway</text>
  <rect x="360" y="95" width="160" height="50" rx="6" fill="#fff" stroke="#ff9900"/><text x="440" y="116" font-size="13" text-anchor="middle">AWS AppConfig</text><text x="440" y="133" font-size="11" text-anchor="middle" fill="#555">routing table (JSON)</text>
  <rect x="560" y="95" width="160" height="50" rx="6" fill="#fff" stroke="#ff9900"/><text x="640" y="116" font-size="13" text-anchor="middle">Application</text><text x="640" y="133" font-size="11" text-anchor="middle" fill="#555">asks for a route</text>
  <rect x="360" y="175" width="360" height="60" rx="6" fill="#fff" stroke="#ff9900"/><text x="540" y="198" font-size="13" text-anchor="middle" font-weight="bold">Gateway</text><text x="540" y="216" font-size="11" text-anchor="middle" fill="#555">classify error → retry (jitter) · fail over · fail</text><text x="540" y="230" font-size="11" text-anchor="middle" fill="#555">circuit breaker per model</text>
  <line x1="440" y1="145" x2="480" y2="175" stroke="#232f3e" marker-end="url(#a)"/><text x="415" y="165" font-size="10" fill="#555">polls</text>
  <line x1="640" y1="145" x2="600" y2="175" stroke="#232f3e" marker-end="url(#a)"/>
  <rect x="360" y="255" width="110" height="34" rx="6" fill="#232f3e"/><text x="415" y="277" font-size="12" text-anchor="middle" fill="#fff">Nova Pro</text>
  <rect x="485" y="255" width="110" height="34" rx="6" fill="#232f3e"/><text x="540" y="277" font-size="12" text-anchor="middle" fill="#fff">Mistral L3</text>
  <rect x="610" y="255" width="110" height="34" rx="6" fill="#232f3e"/><text x="665" y="277" font-size="12" text-anchor="middle" fill="#fff">Nova 2 Lite</text>
  <line x1="540" y1="235" x2="540" y2="255" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- section 3 -->
  <rect x="780" y="55" width="160" height="250" rx="10" fill="#f2f8f0" stroke="#1d8102"/>
  <text x="795" y="80" font-size="14" font-weight="bold" fill="#1d8102">§3 Cost</text>
  <text x="860" y="130" font-size="12" text-anchor="middle">measured $ / task</text>
  <text x="860" y="150" font-size="12" text-anchor="middle">× traffic mix</text>
  <text x="860" y="170" font-size="12" text-anchor="middle">× 2 M requests</text>
  <text x="860" y="210" font-size="13" text-anchor="middle" font-weight="bold">single model</text>
  <text x="860" y="228" font-size="13" text-anchor="middle">vs</text>
  <text x="860" y="246" font-size="13" text-anchor="middle" font-weight="bold">routed</text>
  <line x1="300" y1="180" x2="340" y2="180" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="180" x2="780" y2="180" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/>
</svg>
