<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c66c00"/></marker>
  </defs>
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#232f3e">mlaidp2-m04-support-flow — 12 nodes, 19 connections (the definition in §3, drawn)</text>
  <!-- Start -->
  <rect x="20" y="160" width="120" height="64" rx="8" fill="#f1f8fd" stroke="#0073bb"/><text x="80" y="182" font-size="13" text-anchor="middle" font-weight="bold">Start</text><text x="80" y="198" font-size="11" text-anchor="middle" fill="#555">Input · document</text><text x="80" y="213" font-size="10" text-anchor="middle" fill="#555">{message, customer_id}</text>
  <!-- Triage -->
  <rect x="175" y="160" width="125" height="64" rx="8" fill="#fff7ec" stroke="#ff9900"/><text x="237" y="182" font-size="13" text-anchor="middle" font-weight="bold">Triage</text><text x="237" y="198" font-size="11" text-anchor="middle" fill="#555">Prompt node</text><text x="237" y="213" font-size="10" text-anchor="middle" fill="#555">pins triage:N</text>
  <!-- Lambda -->
  <rect x="335" y="160" width="140" height="64" rx="8" fill="#232f3e"/><text x="405" y="182" font-size="13" text-anchor="middle" font-weight="bold" fill="#fff">DecideAndCRM</text><text x="405" y="198" font-size="11" text-anchor="middle" fill="#ddd">LambdaFunction</text><text x="405" y="213" font-size="10" text-anchor="middle" fill="#ddd">decide() + briefing</text>
  <!-- Route -->
  <polygon points="565,150 625,192 565,234 505,192" fill="#fff" stroke="#232f3e"/><text x="565" y="189" font-size="12" text-anchor="middle" font-weight="bold">Route</text><text x="565" y="204" font-size="10" text-anchor="middle" fill="#555">Condition</text>
  <!-- specialists -->
  <rect x="712" y="55" width="118" height="44" rx="8" fill="#fff7ec" stroke="#ff9900"/><text x="771" y="74" font-size="12" text-anchor="middle" font-weight="bold">Billing</text><text x="771" y="90" font-size="10" text-anchor="middle" fill="#555">Prompt · billing:N</text>
  <rect x="712" y="125" width="118" height="44" rx="8" fill="#fff7ec" stroke="#ff9900"/><text x="771" y="144" font-size="12" text-anchor="middle" font-weight="bold">Technical</text><text x="771" y="160" font-size="10" text-anchor="middle" fill="#555">Prompt · technical:N</text>
  <rect x="712" y="195" width="118" height="44" rx="8" fill="#fff7ec" stroke="#ff9900"/><text x="771" y="214" font-size="12" text-anchor="middle" font-weight="bold">Clarify</text><text x="771" y="230" font-size="10" text-anchor="middle" fill="#555">Prompt · clarifier:N</text>
  <rect x="712" y="265" width="118" height="44" rx="8" fill="#fff7ec" stroke="#ff9900"/><text x="771" y="284" font-size="12" text-anchor="middle" font-weight="bold">General</text><text x="771" y="300" font-size="10" text-anchor="middle" fill="#555">Prompt · general:N</text>
  <!-- outputs -->
  <rect x="850" y="59" width="95" height="36" rx="18" fill="#e8f5e3" stroke="#1d8102"/><text x="897" y="82" font-size="11" text-anchor="middle">BillingOut</text>
  <rect x="850" y="129" width="95" height="36" rx="18" fill="#e8f5e3" stroke="#1d8102"/><text x="897" y="152" font-size="11" text-anchor="middle">TechnicalOut</text>
  <rect x="850" y="199" width="95" height="36" rx="18" fill="#e8f5e3" stroke="#1d8102"/><text x="897" y="222" font-size="11" text-anchor="middle">ClarifyOut</text>
  <rect x="850" y="269" width="95" height="36" rx="18" fill="#e8f5e3" stroke="#1d8102"/><text x="897" y="292" font-size="11" text-anchor="middle">GeneralOut</text>
  <!-- main data path -->
  <line x1="140" y1="192" x2="175" y2="192" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="300" y1="192" x2="335" y2="192" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="475" y1="192" x2="505" y2="192" stroke="#232f3e" marker-end="url(#a)"/>
  <text x="317" y="185" font-size="10" text-anchor="middle" fill="#555">facts</text>
  <text x="490" y="185" font-size="10" text-anchor="middle" fill="#555">label</text>
  <!-- conditional -->
  <path d="M565,150 L565,77 L712,77" fill="none" stroke="#c66c00" stroke-dasharray="5,3" marker-end="url(#o)"/>
  <path d="M595,171 L640,147 L712,147" fill="none" stroke="#c66c00" stroke-dasharray="5,3" marker-end="url(#o)"/>
  <path d="M595,213 L640,217 L712,217" fill="none" stroke="#c66c00" stroke-dasharray="5,3" marker-end="url(#o)"/>
  <path d="M565,234 L565,287 L712,287" fill="none" stroke="#c66c00" stroke-dasharray="5,3" marker-end="url(#o)"/>
  <text x="600" y="71" font-size="11" fill="#c66c00">isBilling</text>
  <text x="648" y="141" font-size="11" fill="#c66c00">isTechnical</text>
  <text x="648" y="211" font-size="11" fill="#c66c00">isClarify</text>
  <text x="600" y="281" font-size="11" fill="#c66c00">default</text>
  <!-- outputs arrows -->
  <line x1="830" y1="77" x2="850" y2="77" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="830" y1="147" x2="850" y2="147" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="830" y1="217" x2="850" y2="217" stroke="#232f3e" marker-end="url(#a)"/>
  <line x1="830" y1="287" x2="850" y2="287" stroke="#232f3e" marker-end="url(#a)"/>
  <!-- Start feeds message/customer_id directly -->
  <path d="M80,224 L80,350 L771,350 L771,309" fill="none" stroke="#0073bb" stroke-dasharray="2,3" marker-end="url(#a)"/>
  <line x1="405" y1="350" x2="405" y2="224" stroke="#0073bb" stroke-dasharray="2,3" marker-end="url(#a)"/>
  <line x1="237" y1="350" x2="237" y2="224" stroke="#0073bb" stroke-dasharray="2,3" marker-end="url(#a)"/>
  <text x="300" y="368" font-size="11" text-anchor="middle" fill="#0073bb">Start.document → customer_id (Lambda) and → message (every prompt node)</text>
  <text x="640" y="368" font-size="11" fill="#555">specialists also get customer = briefing</text>
  <text x="20" y="392" font-size="11" fill="#555">solid = data connection · orange dashed = conditional connection · the Lambda returns {label, facts, briefing}; the condition reads $.data.label</text>
</svg>
